version: 2
updates:
  # One grouped pull request per ecosystem per week. CI merges Cargo updates
  # once the tests pass, and the daily patch-release workflow publishes them.
  # Action updates change the workflows themselves and wait for a review.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      cargo:
        patterns: ["*"]
        # Major updates arrive as their own pull requests and wait for a
        # review, so they never hold back the compatible ones.
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its ref is the Rust version to install, not the action's version.
      # The toolchain moves deliberately, never through Dependabot.
      - dependency-name: dtolnay/rust-toolchain
