name: Release

on:
  push:
    tags:
      - "v*"
  # The patch-release workflow calls this after pushing a tag: a tag pushed
  # with the workflow token does not start other workflows by itself.
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify, build and publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic
      - run: cargo test --all-targets
      - run: cargo package --locked

  build:
    name: Build (${{ matrix.asset }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: whi-x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: whi-x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            asset: whi-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --bin whi --release --locked --target "${{ matrix.target }}"
      - name: Package archive
        run: |
          archive_dir="${{ matrix.asset }}-${RELEASE_TAG#v}"
          mkdir -p "dist/$archive_dir"
          cp LICENSE README.md "dist/$archive_dir/"
          cp "target/${{ matrix.target }}/release/whi" "dist/$archive_dir/"
          tar -C dist -czf "${{ matrix.asset }}.tar.gz" "$archive_dir"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Verify tag version
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$tag_version" = "$package_version"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes release/*
