name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic
      - run: cargo test --all-targets
      - run: cargo package --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: cargo test --all-targets

  # Dependabot's Cargo pull requests merge themselves once every check above
  # passes. Both the author and the latest pusher must be Dependabot, so a
  # person pushing to its branch disables the merge. Action updates change
  # the workflows themselves and wait for a review, and so do updates that move
  # a direct dependency to a semver-incompatible version.
  merge-dependabot:
    name: Merge Dependabot update
    needs: [quality, test]
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.head_ref, 'dependabot/cargo/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # The check runs from the base branch, never from the pull request.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Hold back breaking updates
        id: breaking
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          git fetch -q origin "$HEAD_SHA"
          git show "$HEAD_SHA:Cargo.lock" > "$RUNNER_TEMP/new.lock"
          if python3 .github/scripts/breaking-deps.py Cargo.lock "$RUNNER_TEMP/new.lock"; then
            exit 0
          fi
          echo "Semver-incompatible update; leaving it for a review."
          gh label create breaking --color B60205 --description "Semver-incompatible dependency update" --force
          gh pr edit "$PR_URL" --add-label breaking
          echo "hold=true" >> "$GITHUB_OUTPUT"
      - name: Squash-merge the pull request
        if: steps.breaking.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR_URL"
