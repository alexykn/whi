[package]
name = "whi"
version = "0.8.1"
edition = "2024"
authors = ["Alexander Knott <alexander.knott@posteo.de>"]
description = "Stupid simple PATH management"
repository = "https://github.com/alexykn/whi"
readme = "README.md"
keywords = ["cli", "path", "which", "executable", "unix"]
categories = ["command-line-utilities"]
rust-version = "1.97.1"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "whi"
path = "src/bin/whi.rs"

[dependencies]
libc = "1.0.0-alpha.4"
clap = { version = "4.6.4", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
